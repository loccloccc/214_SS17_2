# ================================
# Server
# ================================
server.port=8080

# ================================
# H2 Database (in-memory)
# ================================
spring.datasource.url=jdbc:h2:mem:restaurantdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ================================
# JPA / Hibernate
# ================================
# create: tao bang moi moi lan khoi dong
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ================================
# H2 Console (kiem tra du lieu)
# http://localhost:8080/h2-console
# JDBC URL: jdbc:h2:mem:restaurantdb
# ================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ================================
# Cho phep Spring Boot chay data.sql
# sau khi Hibernate tao bang xong
# ================================
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
